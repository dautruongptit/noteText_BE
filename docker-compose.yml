version: "3.8"

networks:
  # mysql8 KHONG duoc quan ly boi file compose nay - no la container co san,
  # da noi san vao shared-network tu truoc (docker network create shared-network
  # + docker network connect shared-network mysql8). Compose chi tao them
  # noted-backend va noi vao CUNG network nay de goi duoc mysql8 qua DNS noi
  # bo cua Docker (host "mysql8"), khong can IP/Tailscale nua.
  shared-network:
    external: true

services:
  noted-backend:
    build: .
    container_name: noted-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # QUAN TRONG: dung ${VAR:-default} (khong hard-code gia tri thang) de
      # noi dung THAT trong .env (copy tu .env.development hoac .env.production)
      # duoc uu tien dung - Docker Compose uu tien "environment:" cao hon
      # "env_file:", nen neu ghi thang gia tri o day, no se GHI DE moi gia
      # tri khac trong .env, du ban co doi gi trong do cung vo ich.
      #
      # DB_URL dung ten host "mysql8" (KHONG phai IP hay 127.0.0.1) - day la
      # ten container mysql8 co san tren shared-network, Docker DNS noi bo se
      # tu phan giai ten nay sang IP that cua no. application.yml CHI doc
      # DB_URL/DB_USER/DB_PASSWORD (khong doc DB_HOST/DB_NAME), nen bat buoc
      # phai ghep san thanh URL day du o day.
      DB_URL: "jdbc:mysql://mysql8:3306/${DB_NAME:-note_text}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true"
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-1234567890}
      SERVER_PORT: ${SERVER_PORT:-8084}
    ports:
      - "8084:8084"
    volumes:
      # Thu muc luu file that tren Ubuntu host, mount vao container
      - /data/noted/notes:/data/noted/notes
    networks:
      - shared-network
